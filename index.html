<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }

    #overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

<div id="overlay">Click to view content</div>

<iframe id="video"
  src=""
  allow="autoplay; fullscreen">
</iframe>

<script>
  document.getElementById("overlay").onclick = function () {
    document.getElementById("video").src =
      "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
    this.style.display = "none";
  };
</script>

</body>
</html>
